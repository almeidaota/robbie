[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robbie"
version = "0.1.0"
description = "Deterministic English coach: chat, facts-only session files, ratings computed from weights"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.8",
    "httpx>=0.27",
    "rich>=13.7",
    "genanki>=0.13",
]

[project.scripts]
robbie = "robbie.cli:main"

[tool.setuptools]
packages = ["robbie"]
