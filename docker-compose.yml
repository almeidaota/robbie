services:
  postgres:
    image: postgres:17
    container_name: robbie-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robbie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robbie}
      POSTGRES_DB: ${POSTGRES_DB:-robbie}
    volumes:
      - robbie-postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: robbie-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  robbie-postgres-data:
